[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dleq"
version = "0.1.0"
description = "Deep equilibrium nets for dynamic economic models (JAX + Optax)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "optax==0.2.8",
    "numpy==2.2.6",
    "scipy==1.18.1",
    "matplotlib==3.10.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["dleq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
